<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta - Typing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Main Screen -->
        <div id="mainScreen" class="screen active">
            <div class="game-title">
                <h1>⌨️ DELTA</h1>
                <p>Typing Speed Game</p>
            </div>
            <button id="startBtn" class="btn-primary">Start Game</button>
            <div class="best-score">
                <p>Best Score: <span id="bestScore">0</span> Words</p>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="screen">
            <div class="game-header">
                <div class="timer">
                    <span>Time:</span>
                    <span id="timer">60</span>s
                </div>
                <div class="score">
                    <span>Words:</span>
                    <span id="wpm">0</span>
                </div>
                <div class="accuracy">
                    <span>Accuracy:</span>
                    <span id="accuracy">100</span>%
                </div>
            </div>

            <div class="word-display">
                <p id="currentWord">Word</p>
            </div>

            <div class="input-area">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="Type here..."
                    autocomplete="off"
                >
            </div>

            <div class="stats">
                <p>Correct: <span id="correctCount">0</span></p>
                <p>Wrong: <span id="wrongCount">0</span></p>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="resultScreen" class="screen">
            <div class="result-content">
                <h2>Game Over!</h2>
                <div class="result-stats">
                    <div class="stat-item">
                        <p class="stat-label">Final Words</p>
                        <p class="stat-value" id="finalWPM">0</p>
                    </div>
                    <div class="stat-item">
                        <p class="stat-label">Accuracy</p>
                        <p class="stat-value" id="finalAccuracy">0%</p>
                    </div>
                    <div class="stat-item">
                        <p class="stat-label">Correct</p>
                        <p class="stat-value" id="finalCorrect">0</p>
                    </div>
                    <div class="stat-item">
                        <p class="stat-label">Wrong</p>
                        <p class="stat-value" id="finalWrong">0</p>
                    </div>
                </div>
                <button id="retryBtn" class="btn-primary">Try Again</button>
                <button id="homeBtn" class="btn-secondary">Home</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
